[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensave"
version = "1.0.0"
description = "Cut your LLM bill 60-80%. Drop-in client with semantic cache, prompt compression and model routing."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TokenSaver"}]
keywords = ["llm", "openai", "anthropic", "cost", "optimization", "cache",
            "prompt-compression", "model-routing", "tokens", "gpt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://tokensaver.contentforge-press.workers.dev"
Repository = "https://github.com/contentforge-press/tokensave"
Issues = "https://github.com/contentforge-press/tokensave/issues"

[tool.setuptools]
py-modules = ["tokensave"]
